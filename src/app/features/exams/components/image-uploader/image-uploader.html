<div class="space-y-2">
  <!-- Preview nếu đã có image -->
  @if (imageUrl()) {
    <div class="relative inline-block group">
      <img
        [src]="imageUrl()"
        alt="Question asset"
        class="h-24 w-auto max-w-xs object-cover rounded-2xl border-2 border-brand-pink/30 shadow-sm"
      />
      <button
        type="button"
        (click)="removeImage()"
        class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-red-500 text-white text-xs font-bold flex items-center justify-center hover:bg-red-600 shadow transition-transform group-hover:scale-110 cursor-pointer"
        title="Xoá hình ảnh"
      >
        <app-icon name="x-mark" size="xs" />
      </button>
    </div>
  } @else {
    <!-- Upload hoặc dán link ảnh -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
      <label class="cursor-pointer inline-flex items-center justify-center gap-2 px-3 py-1.5 rounded-xl text-xs font-semibold text-brand-navy dark:text-white bg-brand-pink/10 hover:bg-brand-pink/20 border border-brand-pink/30 transition-all">
        @if (isUploading()) {
          <app-icon name="arrow-path" size="xs" customClass="animate-spin text-brand-pink" />
          <span>Đang tải...</span>
        } @else {
          <app-icon name="image" size="xs" customClass="text-brand-pink" />
          <span>Tải ảnh (.jpg, .png)</span>
        }
        <input
          type="file"
          accept="image/*"
          class="hidden"
          [disabled]="isUploading()"
          (change)="onFileSelected($event)"
        />
      </label>

      <span class="text-xs text-zinc-600 dark:text-zinc-300 text-center font-medium">hoặc</span>

      <div class="relative flex-1">
        <input
          type="url"
          placeholder="Dán link ảnh (URL)..."
          [value]="directUrl()"
          (input)="onDirectUrlChange($event)"
          (blur)="applyDirectUrl()"
          class="w-full text-xs pl-8 pr-2.5 py-1.5 rounded-xl bg-white/80 dark:bg-brand-dark/80 border border-zinc-300 dark:border-white/10 text-brand-navy dark:text-white focus:outline-none focus:border-brand-pink"
        />
        <div class="absolute left-2.5 top-2 text-zinc-600 dark:text-zinc-300 pointer-events-none">
          <app-icon name="link" size="xs" />
        </div>
      </div>
    </div>
  }

  @if (uploadError()) {
    <p class="text-xs text-red-500">{{ uploadError() }}</p>
  }
</div>
