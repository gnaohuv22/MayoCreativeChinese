<app-nav-header [showNavLinks]="false" pageTitle="Đăng ký tài khoản" />

<div class="min-h-screen bg-brand-light dark:bg-brand-dark py-16 px-4 transition-colors">
  <form
    (ngSubmit)="submit()"
    class="max-w-sm mx-auto p-8 rounded-3xl bg-white dark:bg-white/5 border border-brand-navy/10 dark:border-white/10 shadow-xl space-y-5"
  >
    <div>
      <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-brand-pink/15 text-brand-pink border border-brand-pink/30">Miễn phí</span>
      <h1 class="mt-3 text-2xl font-black text-brand-navy dark:text-white tracking-tight font-display">Tạo tài khoản</h1>
      <p class="text-xs text-zinc-600 dark:text-zinc-300 mt-1">Lưu tiến độ flashcard và kết quả bài thi trên mọi thiết bị.</p>
    </div>

    <div class="space-y-1.5">
      <label for="reg-name" class="mcc-label">Họ tên</label>
      <input id="reg-name" name="fullName" autocomplete="name" maxlength="100" [ngModel]="fullName()" (ngModelChange)="fullName.set($event); error.set(null)" class="mcc-input" />
    </div>

    <div class="space-y-1.5">
      <label for="reg-phone" class="mcc-label">Số điện thoại</label>
      <input
        id="reg-phone"
        name="phone"
        type="tel"
        inputmode="tel"
        autocomplete="tel"
        [ngModel]="phone()"
        (ngModelChange)="phone.set($event); error.set(null)"
        class="mcc-input"
      />
    </div>

    <div class="space-y-1.5">
      <label for="reg-password" class="mcc-label">Mật khẩu</label>
      <div class="flex gap-2">
        <input
          id="reg-password"
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="new-password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event); error.set(null)"
          class="mcc-input flex-1 min-w-0"
        />
        <button type="button" (click)="showPassword.set(!showPassword())" class="shrink-0 px-3 rounded-xl text-xs font-bold bg-zinc-100 dark:bg-white/10 text-brand-navy dark:text-white cursor-pointer">
          {{ showPassword() ? 'Ẩn' : 'Hiện' }}
        </button>
      </div>
      <ul class="flex flex-wrap gap-x-4 gap-y-1 pt-1" aria-label="Yêu cầu mật khẩu">
        @for (rule of rules(); track rule.label) {
          <li class="flex items-center gap-1.5 text-[11px]" [class.text-emerald-600]="rule.ok" [class.dark:text-emerald-400]="rule.ok" [class.text-zinc-500]="!rule.ok">
            <app-icon [name]="rule.ok ? 'check-circle' : 'x-circle'" size="xs" />
            <span>{{ rule.label }}</span>
          </li>
        }
      </ul>
    </div>

    <label class="flex items-start gap-2.5 cursor-pointer">
      <input
        type="checkbox"
        name="consent"
        [checked]="consent()"
        (change)="consent.set($any($event.target).checked); error.set(null)"
        class="mt-0.5 w-4 h-4 shrink-0 rounded accent-brand-pink cursor-pointer"
      />
      <span class="text-xs leading-relaxed text-brand-navy/80 dark:text-brand-text-dark/80">
        Tôi đồng ý để Mayo Creative Chinese lưu trữ và sử dụng họ tên, số điện thoại trên để quản lý tài khoản và liên hệ khi cần.
        MCC không chia sẻ thông tin này cho bên thứ ba; bạn có thể yêu cầu xoá tài khoản bất cứ lúc nào qua Fanpage hoặc hotline của MCC.
      </span>
    </label>

    <app-turnstile action="signup" (token)="turnstileToken.set($event); error.set(null)" />

    @if (error()) {
      <p class="text-xs font-semibold text-red-600 dark:text-red-400" role="alert">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="submitting()"
      class="w-full py-2.5 rounded-full bg-brand-pink hover:bg-brand-pink/90 disabled:opacity-60 disabled:cursor-not-allowed text-white font-bold text-sm shadow-lg shadow-brand-pink/25 transition-all cursor-pointer"
    >
      {{ submitting() ? 'Đang tạo tài khoản…' : 'Đăng ký' }}
    </button>

    <p class="text-xs text-center text-zinc-600 dark:text-zinc-300">
      Đã có tài khoản?
      <a routerLink="/dang-nhap" [queryParams]="returnQuery()" class="font-bold text-brand-pink hover:underline">Đăng nhập</a>
    </p>
  </form>
</div>
