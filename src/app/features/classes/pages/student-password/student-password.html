<app-nav-header [showNavLinks]="false" pageTitle="Đổi mật khẩu" />

<div class="min-h-screen bg-brand-light dark:bg-brand-dark py-12 px-4 transition-colors">
  <form (ngSubmit)="submit()" class="max-w-sm mx-auto p-8 rounded-3xl bg-white dark:bg-white/5 border border-brand-navy/10 dark:border-white/10 shadow-xl space-y-5">
    <div>
      <h1 class="text-2xl font-black text-brand-navy dark:text-white tracking-tight font-display">
        {{ forced() ? 'Đặt mật khẩu của bạn' : 'Đổi mật khẩu' }}
      </h1>
      @if (forced()) {
        <p class="text-xs text-zinc-600 dark:text-zinc-300 mt-1">Đổi mật khẩu giáo viên cấp trước khi bắt đầu học.</p>
      }
    </div>

    <input type="text" name="username" autocomplete="username" [value]="auth.username()" class="hidden" readonly aria-hidden="true" tabindex="-1" />

    <label class="block space-y-1.5">
      <span class="mcc-label">Mật khẩu hiện tại</span>
      <input [type]="show() ? 'text' : 'password'" name="current" autocomplete="current-password" required
             [ngModel]="current()" (ngModelChange)="current.set($event); error.set(null)" class="mcc-input" />
    </label>

    <div class="space-y-1.5">
      <div class="flex items-center justify-between">
        <label for="new-pw" class="mcc-label">Mật khẩu mới</label>
        <button type="button" (click)="show.set(!show())" class="text-xs font-bold text-brand-pink hover:underline cursor-pointer">{{ show() ? 'Ẩn' : 'Hiện' }}</button>
      </div>
      <input id="new-pw" [type]="show() ? 'text' : 'password'" name="next" autocomplete="new-password" required
             [ngModel]="next()" (ngModelChange)="next.set($event); error.set(null)" class="mcc-input" />
      <ul class="flex flex-wrap gap-x-4 gap-y-1 pt-1" aria-label="Yêu cầu mật khẩu">
        @for (rule of rules(); track rule.label) {
          <li class="flex items-center gap-1.5 text-[11px]" [class.text-emerald-600]="rule.ok" [class.text-zinc-500]="!rule.ok">
            <app-icon [name]="rule.ok ? 'check-circle' : 'x-circle'" size="xs" /> {{ rule.label }}
          </li>
        }
      </ul>
    </div>

    <label class="block space-y-1.5">
      <span class="mcc-label">Nhập lại mật khẩu mới</span>
      <input [type]="show() ? 'text' : 'password'" name="confirm" autocomplete="new-password" required
             [ngModel]="confirm()" (ngModelChange)="confirm.set($event)" class="mcc-input" />
      @if (mismatch()) {
        <span class="block text-[11px] font-semibold text-red-600 dark:text-red-400">Chưa khớp với mật khẩu mới.</span>
      }
    </label>

    @if (error()) {
      <p class="text-xs font-semibold text-red-600 dark:text-red-400" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="!canSubmit()" class="w-full py-2.5 rounded-full bg-brand-pink hover:bg-brand-pink/90 disabled:opacity-60 text-white font-bold text-sm shadow-lg shadow-brand-pink/25 transition-all cursor-pointer disabled:cursor-not-allowed">
      {{ submitting() ? 'Đang lưu…' : 'Lưu mật khẩu' }}
    </button>

    <div class="flex justify-between text-xs font-bold">
      @if (!forced()) {
        <a routerLink="/hoc-vien" class="text-zinc-500 hover:text-brand-pink">Quay lại</a>
      } @else {
        <span></span>
      }
      <button type="button" (click)="signOut()" class="text-zinc-500 hover:text-brand-pink cursor-pointer">Đăng xuất</button>
    </div>
  </form>
</div>
