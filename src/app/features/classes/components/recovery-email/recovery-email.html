<section class="mcc-card p-6 space-y-3" aria-labelledby="recovery-email-title">
  <h2 id="recovery-email-title" class="text-base font-black font-display text-brand-navy dark:text-white">Thêm email khôi phục mật khẩu</h2>
  @if (sentTo(); as sent) {
    <p class="text-sm text-zinc-600 dark:text-zinc-300" aria-live="polite">
      Đã gửi thư xác nhận tới <strong class="text-brand-navy dark:text-white break-all">{{ sent }}</strong>.
      Bấm link trong thư để hoàn tất; sau đó bạn đăng nhập được bằng email này hoặc số điện thoại.
    </p>
  } @else {
    <p class="text-sm text-zinc-600 dark:text-zinc-300">Khi quên mật khẩu, MCC gửi link đặt lại tới email này.</p>
    <form (ngSubmit)="submit()" class="flex flex-wrap gap-2">
      <label for="recovery-email" class="sr-only">Email</label>
      <input
        id="recovery-email"
        name="email"
        type="email"
        inputmode="email"
        autocomplete="email"
        autocapitalize="none"
        spellcheck="false"
        [ngModel]="email()"
        (ngModelChange)="email.set($event); error.set(null)"
        class="mcc-input flex-1 min-w-48"
      />
      <button type="submit" [disabled]="submitting()" class="mcc-btn mcc-btn-primary">
        {{ submitting() ? 'Đang gửi…' : 'Gửi thư xác nhận' }}
      </button>
    </form>
    @if (error()) {
      <p class="text-xs font-semibold text-red-600 dark:text-red-400" role="alert">{{ error() }}</p>
    }
  }
</section>
