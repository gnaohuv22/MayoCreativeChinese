<app-nav-header [showNavLinks]="false" [pageTitle]="text.pageTitle" />

<div class="min-h-screen bg-brand-light dark:bg-brand-dark py-16 px-4 transition-colors">
  <form
    (ngSubmit)="submit()"
    class="max-w-sm mx-auto p-8 rounded-3xl bg-white dark:bg-white/5 border border-brand-navy/10 dark:border-white/10 shadow-xl space-y-5"
  >
    <div>
      <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-brand-pink/15 text-brand-pink border border-brand-pink/30">
        {{ text.badge }}
      </span>
      <h1 class="mt-3 text-2xl font-black text-brand-navy dark:text-white tracking-tight font-display">Đăng nhập</h1>
      <p class="text-xs text-zinc-600 dark:text-zinc-300 mt-1">{{ text.intro }}</p>
    </div>

    <label class="block space-y-1.5">
      <span class="text-xs font-bold text-brand-navy dark:text-white">Tài khoản</span>
      <input
        type="text"
        name="username"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required
        [(ngModel)]="username"
        class="w-full px-4 py-2.5 rounded-xl text-sm bg-zinc-50 dark:bg-white/5 border border-brand-navy/10 dark:border-white/10 text-brand-navy dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-pink/40"
      />
    </label>

    <label class="block space-y-1.5">
      <span class="text-xs font-bold text-brand-navy dark:text-white">Mật khẩu</span>
      <input
        type="password"
        name="password"
        autocomplete="current-password"
        required
        [(ngModel)]="password"
        class="w-full px-4 py-2.5 rounded-xl text-sm bg-zinc-50 dark:bg-white/5 border border-brand-navy/10 dark:border-white/10 text-brand-navy dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-pink/40"
      />
    </label>

    @if (error()) {
      <p class="text-xs font-semibold text-red-600 dark:text-red-400" role="alert">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="isSubmitting()"
      class="w-full py-2.5 rounded-full bg-brand-pink hover:bg-brand-pink/90 disabled:opacity-60 text-white font-bold text-sm shadow-lg shadow-brand-pink/25 transition-all"
    >
      {{ isSubmitting() ? 'Đang đăng nhập…' : 'Đăng nhập' }}
    </button>
  </form>
</div>
