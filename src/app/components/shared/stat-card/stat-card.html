<div class="p-5 rounded-3xl bg-white/80 dark:bg-brand-dark/80 border border-brand-navy/10 dark:border-white/10 shadow-sm backdrop-blur-md flex items-center justify-between transition-all hover:shadow-md hover:-translate-y-0.5">
  <div class="space-y-1">
    <div class="text-xs font-semibold text-zinc-600 dark:text-zinc-300">
      {{ label() }}
    </div>
    <div [class]="valueColorClass()" class="text-2xl sm:text-3xl font-black tracking-tight font-display">
      {{ value() }}
    </div>
    @if (subtext()) {
      <div class="text-[11px] text-zinc-600 dark:text-zinc-300">
        {{ subtext() }}
      </div>
    }
  </div>

  @if (icon()) {
    <div [class]="iconBgClass()" class="w-12 h-12 rounded-2xl flex items-center justify-center shrink-0">
      <app-icon [name]="icon()!" size="lg" [customClass]="iconColorClass()" />
    </div>
  }
</div>
