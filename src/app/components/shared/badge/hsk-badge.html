<div class="inline-flex items-center gap-1.5 shrink-0 whitespace-nowrap">
  <span class="px-2.5 py-0.5 rounded-full text-xs font-black bg-brand-pink text-white shadow-sm shrink-0 whitespace-nowrap inline-block">
    {{ (showNewPrefix() || version() === '3.0') ? 'NEW HSK' : 'HSK' }}&nbsp;{{ level() }}
  </span>

  @if (showVersion()) {
    <span
      [class.bg-blue-100]="version() === '2.0'"
      [class.text-blue-700]="version() === '2.0'"
      [class.dark:bg-blue-950/60]="version() === '2.0'"
      [class.dark:text-blue-300]="version() === '2.0'"
      [class.border-blue-200]="version() === '2.0'"
      [class.dark:border-blue-800/40]="version() === '2.0'"
      [class.bg-purple-100]="version() === '3.0'"
      [class.text-purple-700]="version() === '3.0'"
      [class.dark:bg-purple-950/60]="version() === '3.0'"
      [class.dark:text-purple-300]="version() === '3.0'"
      [class.border-purple-200]="version() === '3.0'"
      [class.dark:border-purple-800/40]="version() === '3.0'"
      class="px-2 py-0.5 rounded-full text-[11px] font-bold border shrink-0 whitespace-nowrap inline-block"
    >
      v{{ version() }}
    </span>
  }
</div>
