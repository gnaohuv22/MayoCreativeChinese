<!--
  Supabase › Authentication › Emails › Templates › "Reset Password"
  Subject: Đặt lại mật khẩu Mayo Creative Chinese
-->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #2D2D5F;">
  <h2 style="margin: 0 0 16px; font-size: 20px;">Đặt lại mật khẩu</h2>
  <p style="margin: 0 0 16px; font-size: 14px; line-height: 1.6;">
    Bạn (hoặc ai đó) vừa yêu cầu đặt lại mật khẩu cho tài khoản <strong>{{ .Email }}</strong> tại Mayo Creative Chinese.
    Link dưới đây dùng được trong 1 giờ.
  </p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .ConfirmationURL }}"
       style="display: inline-block; padding: 12px 24px; border-radius: 999px; background: #CE2D6E; color: #ffffff; font-weight: bold; font-size: 14px; text-decoration: none;">
      Đặt mật khẩu mới
    </a>
  </p>
  <p style="margin: 0; font-size: 12px; line-height: 1.6; color: #6b7280;">
    Nếu bạn không yêu cầu, hãy bỏ qua thư này — mật khẩu hiện tại vẫn giữ nguyên.
  </p>
</div>
