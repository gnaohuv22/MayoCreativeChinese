<!--
  Supabase › Authentication › Emails › Templates › "Change Email Address"
  Subject: Xác nhận email khôi phục Mayo Creative Chinese
-->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #2D2D5F;">
  <h2 style="margin: 0 0 16px; font-size: 20px;">Xác nhận email mới</h2>
  <p style="margin: 0 0 16px; font-size: 14px; line-height: 1.6;">
    Bấm nút dưới đây để dùng <strong>{{ .NewEmail }}</strong> cho tài khoản Mayo Creative Chinese của bạn.
    Sau khi xác nhận, bạn đăng nhập được bằng email này và nhận được link khi quên mật khẩu.
  </p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .ConfirmationURL }}"
       style="display: inline-block; padding: 12px 24px; border-radius: 999px; background: #CE2D6E; color: #ffffff; font-weight: bold; font-size: 14px; text-decoration: none;">
      Xác nhận email
    </a>
  </p>
  <p style="margin: 0; font-size: 12px; line-height: 1.6; color: #6b7280;">
    Nếu bạn không yêu cầu, hãy bỏ qua thư này.
  </p>
</div>
